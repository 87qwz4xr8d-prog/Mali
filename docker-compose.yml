name: mali

services:
  mali:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22.14.0"
    image: mali-cmms:0.1.0
    container_name: mali
    restart: unless-stopped
    ports:
      - "${MALI_BIND:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      MALI_DATA_DIR: /var/lib/mali
      MALI_SESSION_SECRET: ${MALI_SESSION_SECRET:?set MALI_SESSION_SECRET in .env}
      MALI_ADMIN_PASSWORD: ${MALI_ADMIN_PASSWORD:-}
      MALI_SEED_PASSWORD: ${MALI_SEED_PASSWORD:-}
      MALI_SHOW_SEED_LOGINS: ${MALI_SHOW_SEED_LOGINS:-0}
      MALI_HTTPS: ${MALI_HTTPS:-0}
    volumes:
      - ${MALI_DATA_DIR:-./data}:/var/lib/mali
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
